name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # minet and graph are Bioconductor packages, so the Bioconductor repo has
      # to be on the list before the dependency solver runs.
      # Two dependencies are not plain CRAN packages:
      #   * minet lives on Bioconductor, hence extra-repositories;
      #   * prettyR was ARCHIVED from CRAN, so the solver cannot find it at all
      #     and installs from the archive tarball instead. That is a workaround,
      #     not a fix: the package Depends on something CRAN no longer ships.
      #     It is used in exactly one place, discretize.R:42, and only to list
      #     which columns are numeric -- replaceable with base R, but that would
      #     change which columns get discretized, so it is left for a change
      #     that can be validated on its own.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            url::https://cran.r-project.org/src/contrib/Archive/prettyR/prettyR_2.2-3.tar.gz
          needs: check
          extra-repositories: https://bioconductor.org/packages/release/bioc

      # Gates on ERRORS only. The package has two warnings that predate this
      # workflow -- undeclared imports in NAMESPACE, and six Rd files with
      # undocumented arguments, none of them in the files this branch touches.
      # Tightening to error-on warning means fixing those first; that is a
      # packaging change of its own, not something to smuggle in here.
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          args: 'c("--no-manual", "--no-build-vignettes")'
          upload-snapshots: true
