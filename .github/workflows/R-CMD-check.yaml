name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # minet is a Bioconductor package, so that repository has to be on the
      # list before the solver runs. Everything else is plain CRAN -- which only
      # became true once the dependency on the archived prettyR was removed;
      # before that the solver could not produce a plan at all.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          extra-repositories: https://bioconductor.org/packages/release/bioc

      # Gates on ERRORS only. The package reports two warnings that predate this
      # workflow: undeclared NAMESPACE imports, and six Rd files with
      # undocumented arguments -- none of them files this branch touches.
      # Tightening to warnings means fixing those first, which is a packaging
      # change of its own.
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          args: 'c("--no-manual", "--no-build-vignettes")'
          upload-snapshots: true
